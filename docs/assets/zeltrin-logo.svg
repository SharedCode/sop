<svg xmlns="http://www.w3.org/2000/svg" width="480" height="80" viewBox="0 0 480 80">
  <defs>
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00f2fe" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Minimal Geometric Z Symbol Icon Badge -->
  <rect x="8" y="10" width="60" height="60" rx="16" fill="#0b0f19" stroke="url(#zGrad)" stroke-width="1.5" filter="url(#glow)"/>
  
  <!-- Geometric Z Symbol -->
  <path d="M 23,24 L 53,24 L 53,30.5 L 34,49.5 L 53,49.5 L 53,56 L 23,56 L 23,49.5 L 42,30.5 L 23,30.5 Z" fill="url(#zGrad)"/>

  <!-- Wordmark -->
  <text x="82" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5" fill="url(#textGrad)">Zeltrin</text>
  
  <!-- Tagline -->
  <text x="82" y="61" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="500" letter-spacing="0.2" fill="#94a3b8">Durable Memory &amp; Verification for AI Agents</text>
</svg>
