<svg xmlns="http://www.w3.org/2000/svg" width="480" height="80" viewBox="0 0 480 80">
  <defs>
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00f2fe" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Minimal Geometric Z Symbol Icon Badge (Horizontally Centered) -->
  <rect x="48" y="10" width="60" height="60" rx="16" fill="#0b0f19" stroke="url(#zGrad)" stroke-width="1.5" filter="url(#glow)"/>
  
  <!-- Geometric Z Symbol -->
  <path d="M 63,24 L 93,24 L 93,30.5 L 74,49.5 L 93,49.5 L 93,56 L 63,56 L 63,49.5 L 82,30.5 L 63,30.5 Z" fill="url(#zGrad)"/>

  <!-- Wordmark -->
  <text x="124" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5" fill="url(#textGrad)">Joltrin</text>
  
  <!-- Tagline: From Milliseconds to Microseconds for AI Agents -->
  <text x="124" y="59" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="10.8" font-weight="500" letter-spacing="0.1" fill="#94a3b8">From Milliseconds to Microseconds for AI Agents</text>
</svg>
