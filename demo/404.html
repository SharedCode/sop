<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Joltrin...</title>
  <script>
    (function() {
      var path = window.location.pathname.toLowerCase();
      if (path.includes('/arena')) {
        window.location.replace('/joltrin/arena/');
      } else if (path.includes('/agents')) {
        window.location.replace('/joltrin/agents/');
      } else {
        window.location.replace('/joltrin/');
      }
    })();
  </script>
</head>
<body style="background:#070a13; color:#94a3b8; font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif; text-align:center; padding-top:20vh;">
  <p>Redirecting to <a href="/joltrin/" style="color:#00f2fe; text-decoration:none; font-weight:600;">Joltrin</a>...</p>
</body>
</html>
