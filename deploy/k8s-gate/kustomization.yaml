apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: joltrin-system
resources:
  - namespace.yaml
  - policy.yaml
  - certificate.yaml
  - deployment.yaml
  - service.yaml
  - webhook.yaml
# The gate keeps recorded steps in memory, so it runs as one replica. A restart
# forgets them, which only makes the gate stricter: protected deletes are denied
# until the steps are recorded again.
