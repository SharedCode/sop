name: Deploy SOP Arena (Game Experience)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'sop-arena/**'
      - '.github/workflows/deploy-arena.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-arena"
  cancel-in-progress: false

jobs:
  build-arena:
    name: Build SOP Arena React Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'sop-arena/package-lock.json'

      - name: Install Dependencies
        working-directory: ./sop-arena
        run: npm ci || npm install

      - name: Build Application
        working-directory: ./sop-arena
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './sop-arena/dist'

  deploy-arena:
    name: Deploy SOP Arena to GitHub Pages
    needs: build-arena
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
